<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektrik Fatura Kontrol</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f3f5f9;color:#0b0b0b;font-size:13px}
.ust{background:#1a3a6b;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.ust h1{margin:0;font-size:18px;letter-spacing:.3px}
.ust .alt{font-size:12px;opacity:.85}
.ust .bosluk{flex:1}
.ust a{color:#fff;font-size:12px}
.btn-yenile{background:#e67e22;border:1px solid #d35400;color:#fff;font-weight:700;padding:8px 16px;border-radius:6px;cursor:pointer;box-shadow:0 3px 10px rgba(211,84,0,.45);font-size:13px}
.btn-yenile:hover{background:#d35400}
.btn-yenile:disabled{opacity:.6;cursor:wait}
.btn{background:#fff;border:1px solid #c7cfdc;color:#1a3a6b;font-weight:600;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:12.5px}
.btn:hover{background:#eef2f8}
.duzen{display:flex;align-items:flex-start;min-height:calc(100vh - 56px)}
.sol{width:270px;flex:0 0 270px;background:#1e8449;border-right:1px solid #186a3b;color:#fff;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;padding:14px 12px 30px}
/* Tüm pano kutucuklu: bölüm başlıkları koyu şerit, konular ve filtreler ayrı kutucuk */
.sol h3{margin:12px 0 6px;padding:5px 10px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.25);border-radius:6px}
.sol h3:first-child{margin-top:0}
/* Konu menüsü: her konu ayrı kutucuk */
.konu{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:0 0 5px;border-radius:7px;cursor:pointer;color:#fff;font-weight:600;font-size:13px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.38);border-left:3px solid rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.konu:hover{background:#239b56;border-color:rgba(255,255,255,.7)}
.konu.aktif{background:#fff;border-left-color:#e67e22;border-left-width:5px;color:#d35400;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.konu .ik{width:20px;text-align:center}
.konu .say{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;background:#fff;color:#1a3a6b}
.say.k{background:#c0392b;color:#fff}.say.t{background:#d35400;color:#fff}.say.y{background:#fff;color:#1e8449}.say.m{background:#7d3c98;color:#fff}
.konu.aktif .say{box-shadow:0 0 0 1px #1e8449}
/* GES FATURA & KONTROL: güneş temasıyla vurgulu (sayfadaki GES bölümleriyle aynı renk) */
.konu.konu-ges{background:linear-gradient(90deg,#d68910,#f1c40f);border-color:#f9e79f;color:#3b2a00;font-weight:800;letter-spacing:.3px;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.konu.konu-ges:hover{background:linear-gradient(90deg,#ca6f1e,#f4d03f);border-color:#fff}
.konu.konu-ges.aktif{background:#fff8dc;border-left-color:#d68910;color:#9a6400}
.konu.konu-ges .say{background:#7a5200;color:#fff}
.filtre{display:flex;flex-direction:column;gap:4px;margin:0 0 5px;padding:6px 8px;font-size:11.5px;color:#fff;font-weight:600;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.38);border-left:3px solid rgba(255,255,255,.55);border-radius:7px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filtre select,.filtre input{padding:6px 8px;border:1px solid #186a3b;color:#0b0b0b;border-radius:5px;font-size:12.5px;width:100%}
.ana{flex:1;min-width:0;padding:18px 22px 40px}
.baslik{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.baslik{background:#1a3a6b;color:#fff;padding:10px 14px;border-radius:8px 8px 0 0;margin-bottom:0}
.baslik h2{margin:0;color:#fff;font-size:19px}
.baslik .bosluk{flex:1}
.aciklama{color:#fff;background:#244a84;margin:0 0 12px;padding:8px 14px;line-height:1.55;border-radius:0 0 8px 8px}
.lejant{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rozet{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:10px;font-weight:700;font-size:11px;line-height:18px;white-space:nowrap}
.lejant .rozet,.bulgu .rozet{padding:2px 10px;font-size:12px}
.r-ok{background:#e8f6ee;color:#1e8449}.r-fazla{background:#c0392b;color:#fff}.r-eksik{background:#e67e22;color:#fff}.r-incele{background:#7d3c98;color:#fff}.r-gri{background:#eef0f3;color:#5d6673}.r-mavi{background:#e3eaf5;color:#1a3a6b}
.kartlar{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.kart{background:#1a3a6b;color:#fff;border-radius:8px;padding:12px 14px;border-top:5px solid #5dade2}
.kart .e{font-size:11.5px;color:#d6e4f5;font-weight:600}
.kart .d{font-size:21px;font-weight:700;margin-top:4px;color:#fff !important}
.kart .a{font-size:11.5px;color:#d6e4f5;margin-top:3px}
.kart.ok{border-top-color:#2ecc71}.kart.eksik{border-top-color:#e67e22}.kart.incele{border-top-color:#af7ac5}
.kart.fazla{background:#c0392b;border-top-color:#7b241c}.kart.fazla .e,.kart.fazla .a{color:#fdecea}
.bulgu{background:#1a3a6b;color:#fff;border-left:6px solid #5dade2;border-radius:6px;padding:10px 14px;margin-bottom:8px;line-height:1.55}
.bulgu a{color:#f9e79f}
.bulgu.k{background:#c0392b;border-left-color:#7b241c}.bulgu.y{border-left-color:#2ecc71}.bulgu.t{border-left-color:#e67e22}
.bulgu .rozet{background:#fff}
.tablo-kap{background:#fff;border:1px solid #dde3ec;border-radius:8px;overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:#1a3a6b;color:#fff;padding:4px 5px;line-height:1.2;vertical-align:middle;text-align:center;font-weight:600;position:sticky;top:0;z-index:2;cursor:pointer;white-space:normal;max-width:120px}
th:hover{background:#244a84}
td{padding:2px 5px;border-bottom:1px solid #eef0f3;text-align:center;white-space:nowrap;line-height:1.3}
td.l{text-align:left}td.n{text-align:right;font-variant-numeric:tabular-nums}
td.acik{white-space:nowrap;text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;color:#3d4652;font-size:12px;cursor:help}
/* Tablo satırları %5 küçük (başlık aynı): yazı 12→11,4px, satır içi rozet 11→10,45px / 18→17px */
td{font-size:11.4px}td.acik{font-size:11.4px}td .rozet{font-size:10.45px;line-height:17px}
tr.tik{cursor:pointer}tr.tik:hover td{background:#f5f8fc}
/* Renkli hücreler satır üzerine gelince rengini korur (beyaz yazı okunur kalsın), biraz koyulaşır */
tr.tik:hover td.hucre-fazla{background:#a93226}tr.tik:hover td.hucre-eksik{background:#ca6f1e}tr.tik:hover td.hucre-incele{background:#6c3483}
tr.top td{background:#1a3a6b;color:#fff;font-weight:700;position:sticky;bottom:0}
.ges-ur{margin-top:18px;background:#fffbea;border:2px solid #f1c40f;border-radius:10px;padding:0 0 10px;box-shadow:0 3px 12px rgba(241,196,15,.35);overflow:hidden}.ges-ur h3{margin:0 0 8px;padding:9px 14px;font-size:15px;color:#fff;background:linear-gradient(90deg,#d68910,#f1c40f);text-shadow:0 1px 1px rgba(0,0,0,.25)}.ges-ur .not{font-size:11.5px;color:#5a4400;line-height:1.5;margin:0 14px 8px}.ges-ur .tablo-kap{margin:0 10px;border-color:#f5d76e}.ges-ur .tahmini-not{background:#fff;border:1px solid #e0a800;border-radius:4px;padding:0 5px;color:#8a4b08;font-weight:700}.ges-ur th{position:static;text-align:center;background:#b9770e;color:#fff;border-color:#d68910}.ges-ur td{background:#fffdf3}.ges-ur tr:nth-child(even) td{background:#fff6d6}.ges-ur tr:hover td{background:#ffeaa7}.ges-ur td.tahmini{color:#7a5c00;font-style:italic}.ges-ur tr.secili-ay td{background:#f9e79f;font-weight:700}.ges-ur tr.top td{background:#9a6400;color:#fff}.matris{margin-top:18px;background:#eefaf6;border:2px solid #17a589;border-radius:10px;padding:0 0 10px;box-shadow:0 3px 12px rgba(23,165,137,.3);overflow:hidden}.matris h3{margin:0 0 8px;padding:9px 14px;font-size:15px;color:#fff;background:linear-gradient(90deg,#0e6655,#17a589)}.matris .not{font-size:11.5px;color:#0b4f42;line-height:1.5;margin:0 14px 8px}.matris .tablo-kap{margin:0 10px;border-color:#a3e4d7}.matris th{position:static;text-align:center;background:#117a65;color:#fff}.matris td{background:#fbfffd}.matris tr:nth-child(even) td{background:#e8f8f3}.matris tr:hover td{background:#d1f2eb}.matris td.ges{color:#9a6400}.matris tr.secili-ay td{background:#a3e4d7;font-weight:700}.matris tr.top td{background:#0e6655;color:#fff}.matris .alt-not{font-size:10.5px;font-weight:400;color:#5d6d7e}.matris .eksik-not{font-size:10.5px;font-weight:600;color:#a93226;white-space:normal}.matris .yok{color:#a93226;font-weight:600}
.matris h4{margin:12px 14px 4px;font-size:13.5px;color:#0e6655}.matris th .th-alt{font-weight:400;font-size:10.5px;opacity:.85}.matris td.mah{color:#0e6655}.matris td.f-pos{color:#a93226;font-weight:700}.matris td.f-neg{color:#1e8449;font-weight:700}.matris .karar{margin:0 14px 10px;border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.55;border:2px solid}.matris .karar-bas{font-weight:800;font-size:14px;margin-bottom:3px}.matris .d-tam{background:#e3f4ea;border-color:#1e8449;color:#145a32}.matris .d-eksik{background:#fdecea;border-color:#c0392b;color:#922b21}.matris .d-fazla{background:#fff4e0;border-color:#e67e22;color:#8a4b08}.matris .d-yok{background:#f2f3f4;border-color:#aab7b8;color:#566573}.matris .d-kayma{background:#f4ecf7;border-color:#bb8fce;color:#6c3483}.matris .fazla-uyari{margin-top:6px;background:#fff8e1;border:1px solid #f1c40f;border-radius:6px;padding:4px 8px;color:#7a5200}.matris span.durum{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}.matris .mini{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 3px;border-radius:9px;font-size:10.5px;font-weight:800;cursor:help;margin-left:2px;border:1px solid;vertical-align:middle;line-height:1}.matris .i-fazla{background:#fff3c4;border-color:#e0a800;color:#9a6400}.matris .i-dag{background:#e8f0fe;border-color:#8ab4f8;color:#1a3a6b}.matris .i-kayma{background:#f4ecf7;border-color:#bb8fce;color:#6c3483}.matris .i-yok{background:#f2f3f4;border-color:#aab7b8;color:#566573}.matris .i-tam{background:#e3f4ea;border-color:#1e8449;color:#1e8449}.matris .i-eksik{background:#fdecea;border-color:#c0392b;color:#c0392b}.matris .ikonlar{margin-top:2px}.matris .lejant-mini{margin:6px 14px 2px;font-size:11px;color:#34495e;line-height:1.9}
.ges-ur tr.eksik-ay td{background:#fdecea;color:#a93226;font-weight:600;white-space:normal;text-align:left}
.hucre-ok{color:#1e8449;font-weight:700}
.hucre-fazla{background:#c0392b;color:#fff;font-weight:700}
.hucre-eksik{background:#e67e22;color:#fff;font-weight:700}
.hucre-incele{background:#7d3c98;color:#fff;font-weight:700}
tr.top td.hucre-ok,tr.top td.hucre-fazla,tr.top td.hucre-eksik{color:#fff}
.yanyana{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #dde3ec;border-radius:8px;overflow:hidden;margin:10px 0}
.yanyana .kol{padding:12px 14px}
.yanyana .kol:first-child{background:#f7f9fc;border-right:1px solid #dde3ec}
.yanyana h4{margin:-12px -14px 8px;padding:8px 14px;background:#1a3a6b;color:#fff;font-size:13.5px}
.bos{padding:26px;text-align:center;color:#7a8391}
.modal-arka{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:10px;max-width:980px;width:100%;padding:18px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:-18px -22px 8px;padding:12px 22px;background:#1a3a6b;color:#fff;border-radius:10px 10px 0 0}
.kapat{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#fff;position:relative;z-index:2;margin:-8px -8px 0 0}
#yukleme{position:fixed;inset:0;background:rgba(255,255,255,.75);display:none;align-items:center;justify-content:center;z-index:60;flex-direction:column;gap:10px;font-weight:700;color:#1a3a6b;font-size:15px}
#yukleme .kum{font-size:46px;animation:don 1.4s linear infinite}
@keyframes don{0%{transform:rotate(0)}50%{transform:rotate(180deg)}100%{transform:rotate(180deg)}}
.hizli{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid #dde3ec;border-left:4px solid #e67e22;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.hizli label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:#1a3a6b}
.hizli select{padding:7px 10px;border:1px solid #c7cfdc;border-radius:6px;font-size:13px;min-width:230px}
.hizli .btn{align-self:flex-end}
.sutun-sec{display:inline-flex;align-items:center;gap:6px;font-size:12px;margin:0 0 6px;color:#1a3a6b;font-weight:700;cursor:pointer}
.sutun-sec span{font-weight:400;color:#52514e}
td.lok{max-width:165px;overflow:hidden;text-overflow:ellipsis}
.lok-btn{width:100%;text-align:left;padding:6px 8px;border:1px solid #186a3b;border-radius:5px;background:#fff;color:#0b0b0b;font-size:12.5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hizli .lok-btn{min-width:300px;padding:7px 10px;border-color:#c7cfdc;font-size:13px}
.lok-panel{position:fixed;z-index:80;background:#fff;border:1px solid #1a3a6b;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.3);width:380px;display:flex;flex-direction:column;max-height:70vh}
.lok-panel .lp-bas{background:#1a3a6b;color:#fff;padding:8px 12px;font-weight:700;border-radius:7px 7px 0 0;display:flex;align-items:center}
.lok-panel .lp-bas button{margin-left:auto;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.lok-panel input.lp-ara{margin:8px 10px 4px;padding:7px 9px;border:1px solid #c7cfdc;border-radius:6px;font-size:13px}
.lok-panel .lp-dug{display:flex;gap:6px;padding:0 10px 6px;flex-wrap:wrap}
.lok-panel .lp-liste{overflow-y:auto;padding:0 10px;flex:1;border-top:1px solid #eef0f3}
.lok-panel .lp-liste label{display:flex;gap:7px;align-items:center;padding:3px 2px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f3f5f9}
.lok-panel .lp-liste label span{color:#7a8391;font-size:11px;margin-left:auto}
.lok-panel .lp-alt{padding:8px 10px;display:flex;gap:6px;align-items:center;border-top:1px solid #dde3ec}
.lok-panel .lp-alt b{color:#1a3a6b;font-size:12px}
.not{font-size:12px;color:#52514e;line-height:1.55;margin-top:10px;max-width:1100px}
@media (max-width:900px){.duzen{flex-direction:column}.sol{position:static;width:100%;flex:none;height:auto;border-right:none;border-bottom:1px solid #dde3ec}.yanyana{grid-template-columns:1fr}.ana{padding:14px}}
</style>
<style>/* Başlık ve açıklama: küçük yazı, tek satır (uzun açıklama … ile kesilir, tamamı üzerine gelince) */
.baslik{padding:5px 12px !important;min-height:0}.baslik h2{font-size:15px !important}.baslik .btn{padding:3px 10px;font-size:11.5px}
.aciklama{font-size:11.5px !important;padding:3px 12px !important;line-height:1.45 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
</style>
</head>
<body>
<div id="yukleme"><div class="kum">⏳</div><div id="yuklemeMetin">Yükleniyor…</div></div>

<div class="ust">
  <div>
    <div class="alt">Ödenen faturalar ↔ uygulamanın hesabı · SECENGIDA · AOSB fabrika + CK Akdeniz + ANT Trafo</div>
    <h1>ELEKTRİK FATURA KONTROL</h1>
  </div>
  <div class="bosluk"></div>
  <div class="alt" id="ustDurum"></div>
  <button class="btn-yenile" id="btnYenile" onclick="yenile()">⟳ Veriyi yenile</button>
  <a href="/" id="geriLink">← SECENGIDA ELEKTRİK ANALİZİ</a>
</div>

<div class="duzen">
  <aside class="sol">
    <h3>Sorgulanacak konular</h3>
    <div id="menu"></div>
    <h3>Filtreler</h3>
    <label class="filtre">Yıl<select id="fYil" onchange="ciz()"></select></label>
    <label class="filtre">Ay<select id="fAy" onchange="ciz()"></select></label>
    <label class="filtre">Grup<select id="fGrup" onchange="ciz()"></select></label>
    <label class="filtre">Fatura serisi<select id="fSeri" onchange="ciz()"><option value="">Tümü</option><option value="CK1">CK1 · görevli tedarik (ulusal tarife)</option><option value="CK2">CK2 · ikili anlaşma (PTF bazlı)</option></select></label>
    <label class="filtre">Firma<select id="fFirma" onchange="ciz()"></select></label>
    <label class="filtre">Lokasyon (birden fazla seçilebilir)<button type="button" class="lok-btn" id="fLokBtn" onclick="lokPanelAc(this)">Tüm lokasyonlar</button></label>
    <label class="filtre">Ara (lokasyon / sözleşme / fatura no)<input id="fAra" oninput="ciz()" placeholder="ara…"></label>
    <div class="filtre" style="padding:5px 8px"><button class="btn" style="width:100%" onclick="filtreTemizle()">✕ Filtreleri temizle</button></div>
  </aside>
  <main class="ana">
    <div class="baslik"><h2 id="gBaslik"></h2><div class="bosluk"></div><span id="gArac"></span></div>
    <div class="aciklama" id="gAciklama"></div>
    <div class="lejant" id="lejant"></div>
    <div id="gIcerik"></div>
  </main>
</div>

<div class="modal-arka" id="modal" onclick="if(event.target===this)modalKapat()"><div class="modal" id="modalIc"></div></div>

<script>
const API = location.origin;
let V = null, GORUNUM = 'ozet', SIRALA = null, TABLO = [];
const AY_AD = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const ayEt = a => { const [y, m] = a.split('-'); return AY_AD[+m - 1] + ' ' + y; };
const tl = v => v == null ? '—' : Number(v).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const tl0 = v => v == null ? '—' : Math.round(v).toLocaleString('tr-TR');
const kwh = v => v == null ? '—' : Number(v).toLocaleString('tr-TR', { maximumFractionDigits: 2 });
const yz = v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toLocaleString('tr-TR', Math.abs(v) >= 100 ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const b4 = v => v == null ? '—' : Number(v).toLocaleString('tr-TR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });
const tarih = iso => iso ? new Date(iso).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function yuklemeGoster(m) { document.getElementById('yuklemeMetin').textContent = m || 'Yükleniyor…'; document.getElementById('yukleme').style.display = 'flex'; }
function yuklemeGizle() { document.getElementById('yukleme').style.display = 'none'; }

// Durum sınıflandırması: orantısız tutarlar (ödenen/hesap > 2 veya < 0,5) ayrıca "incelenmeli"
const orantisiz = s => s.hesap && (s.odenen / s.hesap > 2 || s.odenen / s.hesap < 0.5);
function durumAl(s) {
  if (s.mukerrer) return { k: 'mukerrer', ad: '⧉ Mükerrer', c: 'r-incele', h: 'hucre-incele' };
  if (s.durum === 'dogru') return { k: 'dogru', ad: '✔ Doğru', c: 'r-ok', h: 'hucre-ok' };
  if ((s.durum === 'fazla' || s.durum === 'eksik') && orantisiz(s)) return { k: 'incele', ad: '⚠ İncele', c: 'r-incele', h: 'hucre-incele' };
  if (s.durum === 'fazla') return { k: 'fazla', ad: '✘ Fazla', c: 'r-fazla', h: 'hucre-fazla' };
  if (s.durum === 'eksik') return { k: 'eksik', ad: '▼ Az', c: 'r-eksik', h: 'hucre-eksik' };
  if (s.durum === 'ek-fatura') return { k: 'ek', ad: '＋ Ek', c: 'r-mavi', h: '' };
  if (s.durum === 'kapsam-disi') return { k: 'ges', ad: '☀ GES', c: 'r-gri', h: '' };
  return { k: 'yok', ad: '○ Yok', c: 'r-gri', h: '' };
}

const EKRAN_GIZLI = new Set(['Grup', 'Sözleşme no', 'Seri', 'Hesap yöntemi', 'Birim hesap (TL/kWh)', '|Net| (TL)']);
function tumSutun() { try { return localStorage.getItem('elk_tum_sutun') === '1'; } catch (e) { return false; } }
function tumSutunDegis(v) { try { localStorage.setItem('elk_tum_sutun', v ? '1' : '0'); } catch (e) { } ciz(); }

  TABLO = [kolonlar.map(k => k[0]), ...satirlar.map(s => kolonlar.map(k => (k[4] || k[1])(s)))];
  if (opt.toplam) TABLO.push(opt.toplam.map(x => x == null ? '' : x.v));

  const ust = kolonlar.some(k => EKRAN_GIZLI.has(k[0])) ? '<label class="sutun-sec"><input type="checkbox"' + (tumSutun() ? ' checked' : '') + ' onchange="tumSutunDegis(this.checked)"> Tüm sütunları göster' + (gizli ? ' <span>(' + gizli + ' sütun ekranda gizli · Excel, mail ve yazdırmada var)</span>' : '') + '</label>' : '';
  if (!satirlar.length) return ust + '<div class="tablo-kap"><div class="bos">Seçime uyan kayıt yok.</div></div>';
  let h = ust + '<div class="tablo-kap"><table><tr>' + kolonlar.map((k, i) => gor[i] ? '<th onclick="sirala(' + i + ')" title="Sıralamak için tıklayın">' + k[0] + (SIRALA && SIRALA[0] === i ? (SIRALA[1] > 0 ? ' ▲' : ' ▼') : '') + '</th>' : '').join('') + '</tr>';
  for (const s of satirlar) h += '<tr' + (opt.tik ? ' class="tik" onclick="' + opt.tik(s) + '"' : '') + '>' + kolonlar.map((k, i) => { if (!gor[i]) return ''; const v = k[1](s); const cl = k[3] ? k[3](v, s) : ''; return '<td class="' + cl + '"' + (/acik|lok/.test(cl) ? ' title="' + esc(v) + '"' : '') + '>' + (k[2] ? k[2](v, s) : esc(v)) + '</td>'; }).join('') + '</tr>';

    + L.map(m => { const d = dengelendi(m) ? ['⇄ sonraki ayda dengelendi', 'd-kayma'] : DURUM[m.durum]; return '<tr' + sec(m) + '><td class="l">' + ayEt(m.ay) + '</td><td>' + m.rejim + '</td><td class="n">' + (m.gesKwh != null ? kwh(m.gesKwh) : yok('veri yok')) + '</td><td class="n">' + (m.kuralKwh != null ? kwh(m.kuralKwh) : m.durum === 'saatlik-yok' ? yok('OSOS yok') : m.durum === 'fatura-bekleniyor' ? yok('fatura bekleniyor') : '—') + '</td><td class="n mah"><b>' + kwh(m.mahsupKwh) + '</b></td>'
      + '<td class="n">' + (m.ayFark != null ? (m.ayFark > 0 ? '+' : '') + kwh(m.ayFark) + (kayma(m) ? ' ' + ik('⇄', 'i-kayma', 'Okuma dönemi kayması: komşu ayın faturasıyla dengeleniyor, birikimli toplam tutuyor') : '') : '—') + '</td><td class="n"><b>' + (m.kumFark != null ? (m.kumFark > 0 ? '+' : '') + kwh(m.kumFark) + '</b><div class="alt-not">' + (m.kumFarkYuzde > 0 ? '+' : '') + String(m.kumFarkYuzde).replace('.', ',') + '%</div>' : '—</b>') + '</td>'
      + '<td class="n">' + (m.fazlaKwh != null ? (m.fazlaKwh > 0 ? ik('☀', 'i-fazla', 'Mahsup edilmez, satılır; faturada görünmez, ayrıca ödenmeli') + ' ' : '') + kwh(m.fazlaKwh) + '<div class="alt-not">' + tl(m.fazlaTL) + ' TL</div>' : '—') + '</td><td><span class="durum ' + d[1] + '">' + d[0] + '</span></td></tr>'; }).join('') + '</table>';
  return '<div class="matris"><h3>📊 GES mahsup tetkiki · hesaplanan tüm bedel · (−) GES üretimi · ödenen' + (y ? ' · ' + y : '') + '</h3>'

      + '<b>Fark</b> = verilip mahsup edilmeyen enerjinin değeri; saatlik mahsup döneminde bu ihtiyaç fazlasıdır.</div>' : '<div class="not">Amaç: tedarikçinin (CK) faturalarında GES üretiminin <b>mevzuata göre tam mahsup edilip edilmediğini</b> bulmak. Tüm tutarlar <b>KDV ve vergiler dahil</b>, tüm firmalar ve lokasyonlar. '

function ciz() {
  if (!V) return;
  if (!V.var) { sayfa('Veri yok', 'Henüz saklanan fatura yok. Sağ üstteki turuncu <b>Veriyi yenile</b> butonuna basın.', ''); return; }
  const F = filtreli();
  SON_DURUM = durumAnlik();
  menuCiz(F);
  TABLO = [];
  const g = GORUNUM;
  if (g === 'ozet') return ozet(F);
  if (g === 'ay') return ayBazli(F);
  if (g === 'lokasyon') return lokasyonBazli(F);
  if (g === 'firma') return firmaBazli(F);
  if (g === 'mukayese') return mukayese(F);
  if (g === 'firmaEs') return firmaEslestirme();
  if (g === 'mukerrer') return mukerrer(F);
  if (g === 'cift') return cift(F);
  if (g === 'yontem') return yontem();
  const secim = { fatura: () => true, fazla: s => durumAl(s).k === 'fazla', eksik: s => durumAl(s).k === 'eksik', incele: s => durumAl(s).k === 'incele', ek: s => durumAl(s).k === 'ek', ges: s => durumAl(s).k === 'ges' }[g];
  const L = F.filter(secim);
  if (!SIRALA && ['fazla', 'eksik', 'incele'].includes(g)) SIRALA = [11, g === 'eksik' ? 1 : -1];
  const ac = {
    fatura: 'Her satırda faturada ödenen tutar ile uygulamanın EPDK tarifesi, EPİAŞ PTF ve YEKDEM verisiyle hesapladığı tutar yan yana. Satıra tıklayınca kalem kalem hesap açılır. Başlığa tıklayarak sıralayabilirsiniz.',
    fazla: 'Uygulamanın hesabından %3\'ten fazla <b>yüksek</b> faturalanmış faturalar, en büyük farktan küçüğe. Bunlar tedarikçiye itiraz için ilk incelenecek faturalardır.',
    eksik: 'Uygulamanın hesabından %3\'ten fazla <b>düşük</b> faturalanmış faturalar. Genellikle kısmi dönem, mahsup veya sonradan fark faturası gelecek durumlardır.',
    incele: 'Ödenen tutar hesaplananın 2 katından fazla ya da yarısından az. kWh ile tutar orantısız: önceki dönem borcu, gecikme zammı, endeks düzeltmesi ya da panelin PDF\'ten kWh\'yi yanlış okuması olabilir. Fatura PDF\'i ile tek tek bakılmalı.',
    ek: 'kWh bilgisi olmayan faturalar. Ana faturaya ek kesilen fark, düzeltme veya bedel faturalarıdır. Tutar karşılaştırması yapılamaz, aynı ayın ana faturasıyla birlikte değerlendirilmelidir.',
    ges: 'GES tesislerinin faturaları. Üretim ve tüketim mahsuplaştığı için toplam tutar kWh ile doğrudan hesaplanamaz. Kalem kontrolü için fatura PDF\'i gerekir.',
  }[g];
  // Seçili ay/yılda kayıt yoksa: boş tablo yerine diğer dönemlerde kaç kayıt olduğunu ve tek tıkla tüm ayları göster
  let bosNot = '';
  if (!L.length && g !== 'fatura' && (fAy.value || fYil.value)) {
    const T = V.satirlar.filter(secim), aylar = {};
    for (const s of T) aylar[s.donem] = (aylar[s.donem] || 0) + 1;
    const son = Object.keys(aylar).sort().reverse().slice(0, 6);
    bosNot = '<div class="bulgu" style="margin:0 0 10px">ℹ️ Seçili dönemde (<b>' + (fAy.value ? AY_AD[+fAy.value - 1] + ' ' : '') + (fYil.value || '') + '</b>) bu durumda fatura <b>yok</b>'
      + (T.length ? '. Tüm dönemlerde <b>' + T.length.toLocaleString('tr-TR') + '</b> kayıt var; en yeniler: ' + son.map(d => ayEt(d) + ' (' + aylar[d] + ')').join(', ')
        + '. <button class="btn" style="margin-left:6px" onclick="fAy.value=\'\';fYil.value=\'\';ciz()">Tüm ayları göster</button>' : ', diğer dönemlerde de yok.') + '</div>';
  }
  const html = bosNot + tabloCiz(faturaKolonlari(), L, { tik: s => 'detay(\'' + s.dosya.replace(/'/g, '') + '\')', toplam: faturaTopla(L) });
  sayfa(KONULAR.find(k => k[0] === g)[2], ac, html + (g === 'ges' ? gesUretimHtml() + faturaMatrisHtml() : ''), true);
}

function ozet(F) {
  const K = F.filter(s => s.hesap != null && !s.mukerrer);
  const say = k => F.filter(s => durumAl(s).k === k);
  const dogru = say('dogru'), fazla = say('fazla'), eksik = say('eksik'), incele = say('incele');
  const top = (L, f) => L.reduce((t, s) => t + (+f(s) || 0), 0);
  const ids = new Set(F.map(s => s.sozlesmeNo + '|' + s.donem));
  const muk = V.mukerrer.filter(m => ids.has(m.sozlesmeNo + '|' + m.donem)), cf = V.cift.filter(c => ids.has(c.sozlesmeNo + '|' + c.donem));
  const odenen = top(K, s => s.odenen), hesap = top(K, s => s.hesap);
  const anlasma = top(F.filter(s => s.kyas && s.kyas.tarife && !s.mukerrer), s => s.kyas.tarife - s.odenen);
  let h = '<div class="kartlar">';
  h += '<div class="kart"><div class="e">Toplam fatura</div><div class="d">' + F.length.toLocaleString('tr-TR') + '</div><div class="a">Tutar karşılaştırılan: ' + K.length.toLocaleString('tr-TR') + '</div></div>';
  h += '<div class="kart"><div class="e">Faturalarda ödenen (karşılaştırılan)</div><div class="d">' + tl0(odenen) + ' TL</div><div class="a">Uygulamanın hesabı: ' + tl0(hesap) + ' TL</div></div>';
  h += '<div class="kart ' + (odenen - hesap > 0 ? 'fazla' : 'ok') + '"><div class="e">Toplam fark (ödenen − hesap)</div><div class="d" style="color:' + (odenen - hesap > 0 ? '#c0392b' : '#1e8449') + '">' + (odenen - hesap > 0 ? '+' : '') + tl0(odenen - hesap) + ' TL</div><div class="a">' + yz(hesap ? (odenen - hesap) / hesap * 100 : null) + '</div></div>';
  h += '<div class="kart ok"><div class="e">✔ Doğru hesaplanan</div><div class="d">' + dogru.length.toLocaleString('tr-TR') + '</div><div class="a">Karşılaştırılanların %' + (K.length ? dogru.length / K.length * 100 : 0).toLocaleString('tr-TR', { maximumFractionDigits: 1 }) + ' kadarı</div></div>';
  h += '<div class="kart fazla"><div class="e">✘ Fazla faturalanan</div><div class="d">' + fazla.length.toLocaleString('tr-TR') + '</div><div class="a">Fazla tutar: ' + tl0(top(fazla, s => s.fark)) + ' TL</div></div>';
  h += '<div class="kart eksik"><div class="e">▼ Az faturalanan</div><div class="d">' + eksik.length.toLocaleString('tr-TR') + '</div><div class="a">Eksik tutar: ' + tl0(top(eksik, s => s.fark)) + ' TL</div></div>';
  h += '<div class="kart incele"><div class="e">⚠ Orantısız tutar (incelenmeli)</div><div class="d">' + incele.length.toLocaleString('tr-TR') + '</div><div class="a">Ödenen − hesap: ' + tl0(top(incele, s => s.fark)) + ' TL</div></div>';
  h += '<div class="kart fazla"><div class="e">⧉ Mükerrer fatura (kesin)</div><div class="d">' + muk.length + '</div><div class="a">Mükerrer tutar: ' + tl0(top(muk, m => m.fazlaTutar)) + ' TL · aynı ay çok fatura: ' + cf.length + '</div></div>';
  h += '<div class="kart ok"><div class="e">İkili anlaşma kazancı</div><div class="d">' + tl0(anlasma) + ' TL</div><div class="a">CK2 faturaları ulusal tarifeyle kesilseydi ödenecek fazla tutar</div></div>';
  h += '</div>';
  // Bulgular
  const b = [];
  const enF = fazla.slice().sort((x, y) => y.fark - x.fark).slice(0, 5);
  if (enF.length) b.push(['k', '<b>En büyük fazla faturalar:</b> ' + enF.map(s => esc(s.lokasyon) + ' (' + ayEt(s.donem) + ') ödenen ' + tl0(s.odenen) + ' TL, hesap ' + tl0(s.hesap) + ' TL, fark <b>+' + tl0(s.fark) + ' TL</b>').join('; ') + '. <a href="#" onclick="git(\'fazla\');return false">Tümünü gör →</a>']);
  const enI = incele.slice().sort((x, y) => Math.abs(y.fark) - Math.abs(x.fark)).slice(0, 3);
  if (enI.length) b.push(['k', '<b>Orantısız tutarlar:</b> ' + enI.map(s => esc(s.lokasyon) + ' (' + ayEt(s.donem) + ') ' + kwh(s.kwh) + ' kWh için ' + tl0(s.odenen) + ' TL ödenmiş, birim fiyat ' + b4(s.birimOdenen) + ' TL/kWh').join('; ') + '. Bu faturaların PDF\'i açılıp önceki borç veya endeks düzeltmesi olup olmadığına bakılmalı. <a href="#" onclick="git(\'incele\');return false">Listeyi gör →</a>']);
  if (muk.length) b.push(['k', '<b>Kesin mükerrer:</b> ' + muk.map(m => esc(m.lokasyon) + ' ' + ayEt(m.donem) + ' faturası (no ' + m.faturaNo + ', ' + tl0(m.tutar) + ' TL) panelde ' + m.adet + ' kez kayıtlı').join('; ') + '. Ödemenin iki kez yapılıp yapılmadığı muhasebeden kontrol edilmeli. <a href="#" onclick="git(\'mukerrer\');return false">Ayrıntı →</a>']);
  if (cf.length) b.push(['t', '<b>Aynı ay birden çok ana fatura:</b> ' + cf.length + ' lokasyon-ayda iki ayrı fatura kesilmiş, toplam ' + tl0(top(cf, c => c.toplamTutar)) + ' TL. Çoğu tedarikçi değişimi (CK1 + CK2) kaynaklı; aynı seride çift olanlar yeniden düzenleme olabilir. <a href="#" onclick="git(\'cift\');return false">Listeyi gör →</a>']);
  b.push(['y', '<b>Genel değerlendirme:</b> Karşılaştırılan ' + K.length.toLocaleString('tr-TR') + ' faturadan ' + dogru.length.toLocaleString('tr-TR') + ' tanesi uygulamanın hesabıyla ±%3 içinde uyumlu.' + (K.some(s => s.seri === 'CK2') ? ' İkili anlaşmalı (CK2) faturalar her ay tüm dükkânlarda aynı birim fiyattan kesilmiş; bu da anlaşmanın düzenli uygulandığını gösteriyor. Aynı dönemde ulusal tarifeyle faturalansaydı ' + tl0(anlasma) + ' TL daha fazla ödenecekti.' : '') + (K.some(s => s.seri === 'OSB') ? ' AOSB fabrika faturaları son kaynak referansı (PTF+YEKDEM)×1,0938 ile karşılaştırılır; OSB geçici fiyatla keser, kesin fark sonraki faturada düzeltilir (ayrıntı: 🏭 AOSB Fabrika sekmesi).' : '')]);
  TABLO = [['Gösterge', 'Adet', 'Tutar (TL)', 'Açıklama'],
    ['Toplam fatura', F.length, null, 'Tutar karşılaştırılan: ' + K.length],
    ['Faturalarda ödenen (karşılaştırılan)', K.length, Math.round(odenen * 100) / 100, ''],
    ['Uygulamanın hesabı', K.length, Math.round(hesap * 100) / 100, ''],
    ['Toplam fark (ödenen − hesap)', null, Math.round((odenen - hesap) * 100) / 100, hesap ? ((odenen - hesap) / hesap * 100).toFixed(1).replace('.', ',') + ' %' : ''],
    ['✔ Doğru hesaplanan', dogru.length, null, 'Fark ±%3 içinde'],
    ['✘ Fazla faturalanan', fazla.length, Math.round(top(fazla, s => s.fark) * 100) / 100, 'Fazla tutar'],
    ['▼ Az faturalanan', eksik.length, Math.round(top(eksik, s => s.fark) * 100) / 100, 'Eksik tutar'],
    ['⚠ Orantısız tutar (incelenmeli)', incele.length, Math.round(top(incele, s => s.fark) * 100) / 100, 'Ödenen − hesap'],
    ['⧉ Mükerrer fatura (kesin)', muk.length, Math.round(top(muk, m => m.fazlaTutar) * 100) / 100, 'Mükerrer tutar'],
    ['⧉ Aynı ay birden çok fatura', cf.length, Math.round(top(cf, c => c.toplamTutar) * 100) / 100, 'Toplam tutar'],
    ['İkili anlaşma kazancı', null, Math.round(anlasma * 100) / 100, 'CK2 faturaları ulusal tarifeyle kesilseydi ödenecek fazla tutar']];
  const html = h + b.map(([c, t]) => '<div class="bulgu ' + c + '">' + t + '</div>').join('');
  sayfa('Genel özet', 'Filtrelere göre (' + (fYil.value || 'tüm yıllar') + (fAy.value ? ' · ' + AY_AD[+fAy.value - 1] : '') + (fGrup.value ? ' · ' + esc(fGrup.value) : '') + ') ödenen faturaların uygulamanın hesabıyla karşılaştırma özeti. Soldaki konulardan ayrıntıya inebilirsiniz.', html, false);
}

function ayBazli(F) {
  const A = {};
  for (const s of F) {
    const a = (A[s.donem] = A[s.donem] || { ay: s.donem, adet: 0, k: 0, o: 0, h: 0, d: 0, f: 0, e: 0, i: 0, fTL: 0, muk: 0, mukTL: 0, ek: 0, anl: 0 });
    const d = durumAl(s).k;
    a.adet++;
    if (d === 'mukerrer') { a.muk++; a.mukTL += s.odenen; continue; }
    if (s.hesap != null) { a.k++; a.o += s.odenen; a.h += s.hesap; }
    if (d === 'dogru') a.d++; if (d === 'fazla') { a.f++; a.fTL += s.fark; } if (d === 'eksik') a.e++; if (d === 'incele') a.i++; if (d === 'ek') a.ek++;
    if (s.kyas && s.kyas.tarife) a.anl += s.kyas.tarife - s.odenen;
  }
  const piy = Object.fromEntries(V.aylar.map(a => [a.ay, a]));
  const L = Object.values(A).sort((x, y) => x.ay.localeCompare(y.ay)).map(a => ({ ...a, fark: a.o - a.h, yuzde: a.h ? (a.o - a.h) / a.h * 100 : null, ptf: (piy[a.ay] || {}).ptf, yek: (piy[a.ay] || {}).yekdem, kat: (piy[a.ay] || {}).emsalK }));
  const fs = (v, a) => 'n ' + (a.h && Math.abs(a.o - a.h) <= a.h * 0.03 ? 'hucre-ok' : a.o - a.h > 0 ? 'hucre-fazla' : 'hucre-eksik');
  const kol = [
    ['Ay', a => a.ay, v => '<b>' + ayEt(v) + '</b>', () => 'l'],
    ['Fatura', a => a.adet, v => v.toLocaleString('tr-TR')],
    ['Karşılaştırılan', a => a.k, v => v.toLocaleString('tr-TR')],
    ['Faturalarda ödenen (TL)', a => a.o, v => tl(v), () => 'n'],
    ['Uygulamanın hesabı (TL)', a => a.h, v => tl(v), () => 'n'],
    ['Fark (TL)', a => a.fark, v => (v > 0 ? '+' : '') + tl(v), fs],
    ['Fark %', a => a.yuzde, v => yz(v), fs, a => a.yuzde == null ? null : Math.round(a.yuzde * 10) / 10],
    ['✔ Doğru', a => a.d, v => v, v => v ? 'hucre-ok' : ''],
    ['✘ Fazla', a => a.f, v => v, v => v ? 'hucre-fazla' : ''],
    ['▼ Az', a => a.e, v => v, v => v ? 'hucre-eksik' : ''],
    ['⚠ İncele', a => a.i, v => v, v => v ? 'hucre-incele' : ''],

function gvSayi(t) {
  const s = String(t == null ? '' : t).trim().replace(/\s|TL/gi, '');
  if (!s) return NaN;
  const n = s.includes(',') ? parseFloat(s.split('.').join('').replace(',', '.')) : /^-?\d+\.\d{1,2}$/.test(s) ? parseFloat(s) : parseFloat(s.split('.').join(''));
  return Math.round(n * 100) / 100;
}
function gvBicim(i) { const n = gvSayi(i.value); if (isFinite(n)) { i.value = tl(n); i.style.borderColor = '#c7cfdc'; } else if (i.value.trim()) i.style.borderColor = '#c0392b'; }
const guvenceMetni = l => (l || []).map(g => (g.tarih ? g.tarih.split('-').reverse().join('.') : 'başlangıçtan') + ': ' + tl(g.tutar)).join(' · ');

async function firmaKaydet() {
  const eslesme = {};
  document.querySelectorAll('.firmaSec').forEach(s => { if (s.value) eslesme[s.dataset.no] = s.value; });
  const guvenceGecmis = {};
  let hatali = 0, cift = 0;
  document.querySelectorAll('.gvKap').forEach(k => {
    const l = [], tarihler = new Set();
    k.querySelectorAll('.gv').forEach(r => {
      const ti = r.querySelector('.gvTarih'), ui = r.querySelector('.gvTutar'), t = ui.value.trim();
      ui.style.borderColor = ti.style.borderColor = '#c7cfdc';
      if (!t) return;
      const n = gvSayi(t);
      if (!isFinite(n)) { hatali++; ui.style.borderColor = '#c0392b'; return; }
      if (tarihler.has(ti.value)) { cift++; ti.style.borderColor = '#c0392b'; return; }
      tarihler.add(ti.value); l.push({ tarih: ti.value, tutar: n, not: r.dataset.not || '' });
    });
    guvenceGecmis[k.dataset.no] = l;
  });
  if (hatali) { alert(hatali + ' güvence bedeli sayı değil (kırmızı). Örnek: 12.500,00'); return; }
  if (cift) { alert(cift + ' sözleşmede aynı geçerlilik tarihi iki kez girilmiş (kırmızı). Her tarih bir kez olmalı.'); return; }
  const guvenceSayisi = Object.values(guvenceGecmis).reduce((n, l) => n + l.length, 0);
  yuklemeGoster('Firma eşleştirmesi ve güvence bedelleri kaydediliyor…');
  try {
    V = await (await fetch(API + '/api/firma', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ eslesme, firmalar: V.firmaBilgisi.firmalar, guvenceGecmis }) })).json();
    secimler(); ciz();
    alert(Object.keys(eslesme).length + ' lokasyonun firması, ' + guvenceSayisi + ' güvence bedeli kaydı kaydedildi.');
  } catch (e) { alert('Kaydedilemedi: ' + e.message); } finally { yuklemeGizle(); }
}

// Adresle açılış: ?fatura=CK… → o faturanın lokasyonu + ayı ve ayrıntısı · ?lok=NO → lokasyonun faturaları
let ADRES_ACILDI = false;
function adresleAc() {
  if (ADRES_ACILDI || !V || !V.var) return;
  ADRES_ACILDI = true;
  const q = new URLSearchParams(location.search);
  if (q.get('fatura')) { const s = V.satirlar.find(x => x.faturaNo === q.get('fatura')); if (s) { lokAyGit(s.sozlesmeNo, s.donem); setTimeout(() => detay(s.dosya.replace(/'/g, '')), 300); } }
  else if (q.get('lok')) lokGit(q.get('lok'));
}
async function yukle() {

  catch (e) { sayfa('Sunucuya ulaşılamadı', 'ELEKTRİK ANALİZİ sunucusu çalışmıyor olabilir. Hata: ' + esc(e.message), ''); }
  finally { yuklemeGizle(); }
}
async function yenile() {

if (window.self !== window.top) { const g = document.getElementById('geriLink'); if (g) g.style.display = 'none'; }
// Çoklu lokasyon seçimi: LOK_SEC kümesi. fLok.value okuma/yazma (tek lokasyona git, geri dön) aynı kümeyi kullanır
const LOK_SEC = new Set();
const fLok = { get value() { return [...LOK_SEC].join(','); }, set value(v) { LOK_SEC.clear(); String(v || '').split(',').filter(Boolean).forEach(x => LOK_SEC.add(x)); lokBtnGuncelle(); } };
function lokEtiket() {
  if (!LOK_SEC.size) return 'Tüm lokasyonlar';
  const ad = [...LOK_SEC].map(no => LOK_AD[no] || no);
  return LOK_SEC.size === 1 ? ad[0] : LOK_SEC.size + ' lokasyon seçili: ' + ad.slice(0, 2).join(', ') + (ad.length > 2 ? '…' : '');
}
function lokBtnGuncelle() { const b = document.getElementById('fLokBtn'); if (b) { b.textContent = lokEtiket(); b.title = [...LOK_SEC].map(no => LOK_AD[no] || no).join('\n'); } }
function lokPanelAc(btn) {
  lokPanelKapat();
  const gecici = new Set(LOK_SEC);
  const firmaLok = new Set(V.satirlar.filter(s => !fFirma.value || s.firma === fFirma.value).map(s => s.sozlesmeNo));
  const liste = LOK_LISTE.filter(no => firmaLok.has(no));
  const firmaAd = {}; for (const s of V.satirlar) firmaAd[s.sozlesmeNo] = s.firma;
  const p = document.createElement('div'); p.className = 'lok-panel'; p.id = 'lokPanel';
  p.innerHTML = '<div class="lp-bas">📍 Lokasyon seçin' + (fFirma.value ? ' · ' + esc(fFirma.value) : '') + '<button onclick="lokPanelKapat()">×</button></div><input class="lp-ara" placeholder="ara: lokasyon adı veya sözleşme no"><div class="lp-dug"><button class="btn" data-k="tum">✔ Görünenlerin tümünü seç</button><button class="btn" data-k="yok">✕ Seçimi temizle</button></div><div class="lp-liste"></div><div class="lp-alt"><b class="lp-say"></b><span style="flex:1"></span><button class="btn" onclick="lokPanelKapat()">Vazgeç</button><button class="btn-yenile" data-k="uygula" style="padding:6px 14px">Uygula</button></div>';
  document.body.appendChild(p);
  const ara = p.querySelector('.lp-ara'), kap = p.querySelector('.lp-liste'), say = p.querySelector('.lp-say');
  const gorunen = () => { const q = ara.value.trim().toLocaleLowerCase('tr-TR'); return liste.filter(no => !q || ((LOK_AD[no] || '') + ' ' + no).toLocaleLowerCase('tr-TR').includes(q)); };
  const ciz2 = () => { kap.innerHTML = gorunen().map(no => '<label><input type="checkbox" value="' + no + '"' + (gecici.has(no) ? ' checked' : '') + '>' + esc(LOK_AD[no] || no) + '<span>' + esc(firmaAd[no] || '') + ' · ' + no + '</span></label>').join('') || '<div class="bos">Eşleşen lokasyon yok.</div>'; say.textContent = gecici.size ? gecici.size + ' seçili' : 'Seçim yok = tüm lokasyonlar'; };
  kap.onchange = e => { if (e.target.checked) gecici.add(e.target.value); else gecici.delete(e.target.value); say.textContent = gecici.size ? gecici.size + ' seçili' : 'Seçim yok = tüm lokasyonlar'; };
  ara.oninput = ciz2;
  p.onclick = e => { const k = e.target.dataset && e.target.dataset.k; if (k === 'tum') { gorunen().forEach(no => gecici.add(no)); ciz2(); } else if (k === 'yok') { gecici.clear(); ciz2(); } else if (k === 'uygula') { LOK_SEC.clear(); gecici.forEach(x => LOK_SEC.add(x)); lokPanelKapat(); lokBtnGuncelle(); ciz(); } };
  ciz2();
  const r = btn.getBoundingClientRect();
  p.style.left = Math.min(r.left, window.innerWidth - 390) + 'px';
  p.style.top = Math.min(r.bottom + 4, window.innerHeight - 200) + 'px';
  ara.focus();
}
function lokPanelKapat() { const p = document.getElementById('lokPanel'); if (p) p.remove(); }
document.addEventListener('mousedown', e => { const p = document.getElementById('lokPanel'); if (p && !p.contains(e.target) && !e.target.classList.contains('lok-btn')) p.remove(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') lokPanelKapat(); });
